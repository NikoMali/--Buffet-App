<h2>Edit</h2>
        <form [formGroup]="editBlogForm" (ngSubmit)="onSubmit()">

            <div class="hidden">
                <input type="text" formControlName="id" placeholder="id" name="id" class="form-control" id="id">
            </div>


            <div class="form-group">
                <label for="title">title</label>

                <div *ngIf="submitted && f.title.errors" class="invalid-feedback">
                    <div *ngIf="f.title.errors.required">title is required</div>
                </div>
            </div>
            <div class="form-group">
              <label for="date">date</label>
              <input type="text" formControlName="date" class="form-control" [ngClass]="{ 'is-invalid': submitted && f.date.errors }" />
              <div *ngIf="submitted && f.date.errors" class="invalid-feedback">
                  <div *ngIf="f.date.errors.required">date is required</div>
              </div>
          </div>
        <div class="form-group">
          <label for="imageUrl">imageUrl</label>
          <input type="text" formControlName="imageUrl" class="form-control" [ngClass]="{ 'is-invalid': submitted && f.imageUrl.errors }" />
          <div *ngIf="submitted && f.imageUrl.errors" class="invalid-feedback">
              <div *ngIf="f.imageUrl.errors.required">imageUrl is required</div>
          </div>
        </div>
        <div class="form-group">
          <label for="shortDesc">shortDesc</label>
          <input type="text" formControlName="shortDesc" class="form-control" [ngClass]="{ 'is-invalid': submitted && f.shortDesc.errors }" />
          <div *ngIf="submitted && f.shortDesc.errors" class="invalid-feedback">
              <div *ngIf="f.shortDesc.errors.required">shortDesc is required</div>
          </div>
        </div>
            <div class="form-group">
                <button [disabled]="loading" class="btn btn-primary">Update</button>
